name: Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches: [main, master]

# Added permissions to allow the action to push to the output branch
permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Good practice to prevent hanging

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          # your github user name or repo owner
          github_user_name: ${{ github.repository_owner }}
          # generates a snake game from a github user contributions graph, output a svg animation at <svg_out_path>
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
