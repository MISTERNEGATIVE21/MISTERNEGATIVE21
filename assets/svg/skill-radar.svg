<svg width="520" height="520" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="radarFill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="rGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <polygon id="hex" points="0,-190 164,-95 164,95 0,190 -164,95 -164,-95"/>
  </defs>
  
  <rect width="520" height="520" fill="url(#radarBg)"/>
  <text x="260" y="34" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e" font-weight="bold">VLSI SKILL RADAR</text>
  
  <g transform="translate(260,270)">
    <!-- Grid rings -->
    <g fill="none" stroke="#1f6feb" stroke-width="1" opacity="0.5">
      <polygon points="0,-47,41,-24,41,24,0,47,-41,24,-41,-24" opacity="0.25"/>
      <polygon points="0,-95,82,-47,82,47,0,95,-82,47,-82,-47" opacity="0.35"/>
      <polygon points="0,-142,123,-71,123,71,0,142,-123,71,-123,-71" opacity="0.5"/>
      <polygon points="0,-190,164,-95,164,95,0,190,-164,95,-164,-95" opacity="0.7" stroke-width="1.4"/>
    </g>
    <!-- Axis spokes -->
    <g stroke="#1f6feb" stroke-width="1" opacity="0.4">
      <line x1="0" y1="-190" x2="0" y2="190"/>
      <line x1="-164" y1="-95" x2="164" y2="95"/>
      <line x1="-164" y1="95" x2="164" y2="-95"/>
    </g>
    
    <!-- Skill polygon -->
    <polygon points="0,-178 161,-83 138,57 0,88 -88,32 -108,-70"
             fill="url(#radarFill)" stroke="#00d4aa" stroke-width="2.5" filter="url(#rGlow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.035;1" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.7;0.9" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- Vertex dots -->
    <g fill="#00ffcc" filter="url(#rGlow)">
      <circle cx="0" cy="-178" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="161" cy="-83" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="138" cy="57" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="88" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="-88" cy="32" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="-108" cy="-70" r="6"><animate attributeName="r" values="6;7.5;6" dur="2s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    
    <!-- Labels -->
    <g font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="0" y="-208" fill="#00d4aa" font-weight="bold">RTL / SV-UVM</text>
      <text x="222" y="-83" fill="#00d4aa" font-weight="bold">SYNTH</text>
      <text x="218" y="57" fill="#00d4aa" font-weight="bold">PHYS</text>
      <text x="0" y="130" fill="#00d4aa" font-weight="bold">STA</text>
      <text x="-122" y="32" fill="#00d4aa" font-weight="bold">ECO</text>
      <text x="-190" y="-70" fill="#00d4aa" font-weight="bold">FLOW / TCL</text>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(80, 480)" font-family="monospace" font-size="11">
    <rect width="360" height="26" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <circle cx="115" cy="13" r="5" fill="#00ffcc"/>
    <text x="128" y="17" fill="#8b949e">RTL    SYNTH    P&amp;R    STA    ECO    FLOW</text>
  </g>
</svg>