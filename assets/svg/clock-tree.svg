<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="clkSrc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3bf"/>
      <stop offset="40%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </radialGradient>
    <radialGradient id="clkBuf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e8590c"/>
    </radialGradient>
    <radialGradient id="clkSink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#63e6be"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </radialGradient>
    <filter id="glowBtn" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWire">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="300" fill="url(#cktBg)"/>
  <text x="400" y="28" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e" font-weight="bold">CLOCK TREE SYNTHESIS — H-TREE · GLOBAL SKEW &lt; 20ps</text>
  
  <!-- Root oscillator -->
  <g transform="translate(400, 52)">
    <circle cx="0" cy="0" r="14" fill="url(#clkSrc)" filter="url(#glowBtn)">
      <animate attributeName="r" values="14;17;14" dur="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-24" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd43b">PLL @1GT</text>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="7" fill="#0d1117">PLL</text>
  </g>
  
  <!-- Trace: a cloned wave element traveling down each wire to show clock propagation -->
  <defs>
    <g id="wave">
      <circle r="3" fill="#00d4aa" opacity="0.9">
        <animate attributeName="cx" values="0;1" dur="0.01s" fill="freeze"/>
      </circle>
    </g>
  </defs>
  
  <!-- H-Tree wire container (pulses travel root -> leaves) -->
  <g stroke="#ff6b35" stroke-width="2" fill="none" opacity="0.85">
    <path d="M400,66 V96"/>
  </g>
  <!-- Pulse down trunk -->
  <circle cx="400" cy="66" r="3" fill="#ffd43b" filter="url(#glowWire)">
    <animate attributeName="cy" values="66;96" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Level 1: split left/right -->
  <g stroke="#ff6b35" stroke-width="2" fill="none" opacity="0.85">
    <path d="M280,96 H520"/>
  </g>
  <polygon points="280,93 280,99 295,97 295,95" fill="#ff9f43"/>
  <polygon points="520,93 520,99 505,97 505,95" fill="#ff9f43"/>
  <!-- Buffers L1 -->
  <circle cx="280" cy="96" r="5" fill="url(#clkBuf)" filter="url(#glowBtn)"/>
  <circle cx="520" cy="96" r="5" fill="url(#clkBuf)" filter="url(#glowBtn)"/>
  <!-- Pulses along L1 -->
  <g fill="#ffd43b">
    <circle r="3" filter="url(#glowWire)">
      <animate attributeName="cx" values="400;280" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="96;96" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" filter="url(#glowWire)">
      <animate attributeName="cx" values="400;520" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="96;96" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Level 2 down/up to four sinks -->
  <g stroke="#ff6b35" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M280,96 V140 M520,96 V140"/>
    <path d="M200,140 H360 M440,140 H600"/>
  </g>
  <g fill="#ff9f43">
    <circle cx="200" cy="140" r="4.5"/>
    <circle cx="360" cy="140" r="4.5"/>
    <circle cx="440" cy="140" r="4.5"/>
    <circle cx="600" cy="140" r="4.5"/>
  </g>
  <!-- Pulses L2 -->
  <g fill="#ffd43b">
    <circle r="2.5" filter="url(#glowWire)">
      <animate attributeName="cx" values="280;200" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="96;140" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" filter="url(#glowWire)">
      <animate attributeName="cx" values="280;360" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="96;140" dur="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Level 3: down to load points -->
  <g stroke="#ff6b35" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M200,140 V185 M360,140 V185 M440,140 V185 M600,140 V185"/>
  </g>
  
  <!-- Sink points (flip-flops / macros), each with jitter shimmer -->
  <g>
    <circle cx="200" cy="195" r="7" fill="url(#clkSink)" filter="url(#glowBtn)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="195" r="7" fill="url(#clkSink)" filter="url(#glowBtn)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.9s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="195" r="7" fill="url(#clkSink)" filter="url(#glowBtn)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="195" r="7" fill="url(#clkSink)" filter="url(#glowBtn)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g font-family="monospace" font-size="9" fill="#63e6be" text-anchor="middle">
    <text x="200" y="214">FF</text>
    <text x="360" y="214">SRAM</text>
    <text x="440" y="214">MAC</text>
    <text x="600" y="214">FF</text>
  </g>
  
  <!-- Static timing corner readout -->
  <g transform="translate(40, 230)" font-family="monospace">
    <rect x="0" y="0" width="330" height="58" rx="6" fill="#161b22" stroke="#00d4aa" stroke-width="1"/>
    <text x="12" y="18" font-size="10" fill="#8b949e">GLOBAL SKEW</text>
    <text x="180" y="18" font-size="11" fill="#00ffcc" font-weight="bold">LOW</text>
    <text x="12" y="35" font-size="10" fill="#8b949e">LOCAL SKEW</text>
    <text x="180" y="35" font-size="11" fill="#00ffcc" font-weight="bold">LOW</text>
    <text x="12" y="52" font-size="10" fill="#8b949e">INSERTION DELAY</text>
    <text x="180" y="52" font-size="11" fill="#ffd43b" font-weight="bold">OPTIMIZED</text>
  </g>
  
  <!-- Equivalent topology tags -->
  <g transform="translate(430, 240)" font-family="monospace" font-size="10" fill="#8b949e">
    <text x="0" y="0">BUFFERS</text>
    <text x="0" y="18">MAX FANOUT: 16</text>
    <text x="0" y="36">VOLTAGE SCALING</text>
    <text x="0" y="54">
      CORNERS: 
      <tspan fill="#00d4aa">PVT</tspan>
    </text>
  </g>
  
  <!-- Animated balanced-delay equalizer -->
  <g transform="translate(670, 235)">
    <rect x="0" y="0" width="100" height="58" rx="6" fill="#161b22" stroke="#ff6b35" stroke-width="1"/>
    <text x="50" y="16" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff9f43">BALANCED</text>
    <text x="50" y="32" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffd43b">▮▮▮▮</text>
    <rect x="20" y="40" width="60" height="8" rx="2" fill="#00d4aa" opacity="0.35">
      <animate attributeName="width" values="60;45;60" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>